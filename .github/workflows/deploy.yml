name: Deploy to GitHub Pages

# Manual dispatch only for now. GitHub Pages source is still "legacy" (deploy from the
# main branch's raw files), which has its own auto-triggered "pages build and
# deployment" workflow on every push. Running this workflow's deploy step on push too
# raced that legacy deploy and won once, replacing the full-repo legacy site with just
# this workflow's dist/-only build - which doesn't include clinical-kb-4.html - breaking
# that public URL. Do not add a push trigger back until the Pages source is deliberately
# switched to "GitHub Actions" (see the plan's 部署銜接 section) - that switch needs the
# user's go-ahead first.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
