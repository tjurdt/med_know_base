name: Deploy to GitHub Pages

# Pages source was switched from "legacy" (branch-serving) to "GitHub Actions" with the
# user's explicit go-ahead (see the plan's 部署銜接 section) - this workflow is now the
# only thing that deploys the site, so it needs the push trigger. Before this switch, a
# push trigger here raced the legacy auto-deploy and once won, breaking
# clinical-kb-4.html's public URL - that risk no longer applies once legacy serving is
# off, but don't add this trigger back on a repo that's still in legacy mode.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
